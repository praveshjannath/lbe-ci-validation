name: publish-python-runtime

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-python-runtime:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: lbe_guard_inspector/runtime/cline_worker/package-lock.json

      - name: Read canonical Python package metadata
        id: package
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          name = data["project"]["name"]
          version = data["project"]["version"]
          assert name == "lbe-guard-inspector"
          assert version and version.strip() == version
          print(f"name={name}")
          print(f"version={version}")
          print(f"wheel=lbe_guard_inspector-{version}-py3-none-any.whl")
          print(f"sdist=lbe_guard_inspector-{version}.tar.gz")
          PY

      - name: Install build/test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[test]

      - name: Run full Python suite
        run: python -m pytest -q

      - name: Build exact Python artifacts
        run: python -m build

      - name: Verify release artifacts
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          WHEEL_NAME: ${{ steps.package.outputs.wheel }}
          SDIST_NAME: ${{ steps.package.outputs.sdist }}
        run: |
          test -f "dist/${WHEEL_NAME}"
          test -f "dist/${SDIST_NAME}"
          python -m pip install --force-reinstall "dist/${WHEEL_NAME}"
          python - <<'PY'
          import os
          from importlib.metadata import version

          expected = os.environ["PACKAGE_VERSION"]
          assert version("lbe-guard-inspector") == expected
          print(f"PYPI_RUNTIME_ARTIFACT_VERIFY=PASS version={expected}")
          PY

      - name: Publish Python runtime to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
