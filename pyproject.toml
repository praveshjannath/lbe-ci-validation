[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lbe-guard-inspector"
version = "2.0.1"
description = "Persistent provider-neutral governed agent runtime for local workspaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.23.0"
]

[project.optional-dependencies]
test = [
  "build==1.5.0",
  "pytest==8.3.5"
]
tui = [
  "textual>=0.58,<1",
]

[project.scripts]
lbe = "lbe_guard_inspector.cli:main"
lbe-guard-inspector = "server:main"
lbe-guard-inspector-evidence = "lbe_guard_inspector.server:main"
lbe-guard-audit = "audit_controller:main"

[tool.setuptools]
py-modules = ["agent", "audit_controller", "server"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["lbe_guard_inspector*", "rules*", "schemas*"]
namespaces = true

[tool.setuptools.package-data]
schemas = ["*.json"]
"lbe_guard_inspector.memory" = ["memory_schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
